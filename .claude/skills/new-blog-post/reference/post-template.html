<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — Sajith Edirisinghe</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="author" content="Sajith Edirisinghe" />
  <link rel="canonical" href="{{CANONICAL_URL}}" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="{{OG_IMAGE_URL}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="627" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  <meta property="og:site_name" content="Sajith Edirisinghe" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="{{OG_IMAGE_URL}}" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/png" href="../../images/favicon.png" />
  <script src="../../assets/js/head.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/site.js" defer></script>
  <!-- {{EXTRA_SCRIPTS}}: gallery.js if the post has .post-figure images that should open in the lightbox;
       workflow.js if it uses the .workflow scroll timeline. Remove this comment otherwise. -->
</head>

<body>
  <div class="col">
    <div class="bar up">
      <a class="back-link" href="../../index.html"><span class="arrow">&larr;</span> Sajith Edirisinghe</a>
      <button class="theme" type="button" aria-label="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z" /></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" /></svg>
      </button>
    </div>

    <div class="post-hero up d1">
      {{HERO_SVG}}
    </div>

    <article class="up d2">
      <p class="post-meta">{{META}}</p>
      <h1 class="post-title">{{TITLE}}</h1>
      <div class="post-body">
        {{BODY}}
      </div>
    </article>

    <nav class="post-nav up d3">
      <a href="./{{PREV_SLUG}}.html">
        <small>Older post</small>
        <span class="title">{{PREV_TITLE}}</span>
      </a>
    </nav>

    <footer class="footer up d4">
      &copy; <span id="year"></span> Sajith Edirisinghe
    </footer>
  </div>
</body>

</html>
