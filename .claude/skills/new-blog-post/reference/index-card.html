<!-- Insert as the FIRST <li> in the correct year's .post-list (newest first).
     Replace {{THUMB_SVG}} with the 100x100 thumbnail SVG (unique gradient id). -->
<li class="post-item">
  <a href="{{HREF}}">
    <span class="post-thumb">
      {{THUMB_SVG}}
    </span>
    <span class="post-info">
      <span class="post-date">{{DATE_SHORT}}</span>
      <span class="post-title">{{TITLE}}</span>
      <span class="post-excerpt">{{EXCERPT}}</span>
    </span>
  </a>
</li>
