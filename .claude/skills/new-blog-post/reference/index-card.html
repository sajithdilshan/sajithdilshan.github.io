<!-- Insert as the FIRST <li> of <ul class="entries"> under "What I've written" in the
     ROOT index.html (newest first). There is no separate blog index any more. -->
        <li>
          <a class="q" href="blog/{{YEAR}}/{{SLUG}}.html">
            <span class="entry-line">
              <span class="title">{{TITLE}}</span>
              <time datetime="{{ISO_DATE}}">{{MONTH_YEAR}}</time>
            </span>
            <p>{{EXCERPT}}</p>
          </a>
        </li>
