<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitMax – Entry editor (cardio)</title><meta name="description" content="FitMax – Entry editor (cardio) — a design mockup for FitMax, a personal iOS workout tracker built with Claude Code."><link rel="icon" type="image/png" href="../../../images/favicon.png"><link rel="stylesheet" href="style.css"><script>document.documentElement.dataset.theme=localStorage.fmTheme||'';if(top!==self)document.documentElement.classList.add('embed')</script></head><body>
<nav class="topnav"><a href="../first_ios_app.html">&larr; Back to the post</a></nav>
<nav class="deck"><a href="index.html">All screens</a><span class="name">D2. Editor, other types</span><button onclick="document.documentElement.dataset.theme=localStorage.fmTheme=({'':'dark',dark:'light',light:''})[localStorage.fmTheme||'']">Light / dark</button></nav>
<div class="phone">
<div class="status"><span>9:41</span><span class="sys"><i class="ic i-signal"></i><i class="ic i-wifi"></i><span class="batt"></span></span></div>
<div class="behind" style="background:var(--bg);padding:70px 16px"><div class="hl" style="text-align:center">Tue 27 Oct</div><div class="card" style="height:180px;margin-top:20px"></div></div>
<div class="dim"></div>
<div class="sheet" style="top:62px">
  <div class="grab"></div>
  <div class="head"><a class="btn icon glass" href="day.html" aria-label="Close"><i class="ic i-plus" style="transform:rotate(45deg)"></i></a><a class="btn prom icon" href="day.html" aria-label="Done"><i class="ic i-check"></i></a></div>
  <div class="in">
    <h1 class="lt">Rowing Machine</h1>
    <div style="display:flex;gap:6px;margin:8px 0 16px"><span class="chip">Cardio</span><span class="chip"><i class="ic i-flame" style="color:var(--orange)"></i>Calories</span></div>
    <div class="last"><div class="fn">Last time, Tue 20 Oct</div><div class="sets" style="margin:6px 0 0"><span class="set">10</span><span class="set">10</span><span class="unit">cal</span></div></div>
    <section class="card flush" style="padding-left:14px">
      <div class="setrow"><b class="sn">1</b><span class="step"><i class="ic i-minus"></i><b class="score">10<small>cal</small></b><i class="ic i-plus"></i></span></div>
      <div class="setrow"><b class="sn on">2</b><span class="step focus"><i class="ic i-minus"></i><b class="score">12<small>cal</small></b><i class="ic i-plus"></i></span></div>
      <div class="setrow add"><a class="btn sm tint" style="padding-left:0"><i class="ic i-plus"></i>Add set</a><span class="cap">Copies set 2</span></div>
    </section>
    <div class="totals" style="grid-template-columns:1fr 1fr">
      <div><span class="fn">Total</span><b class="score">22<small>cal</small></b></div>
      <div><span class="fn">Last time</span><b class="score muted">20<small>cal</small></b></div>
    </div>
    <div class="sec"><span class="hl">Other tracking types</span></div>
    <section class="card flush" style="padding-left:14px">
      <div class="setrow"><span class="badge" style="background:var(--blue)"><i class="ic i-route"></i></span><div class="tt"><b class="body">Distance</b><span class="cap">Ski Erg, 10 m steps</span></div><span class="step mini"><i class="ic i-minus"></i><b class="score">150<small>m</small></b><i class="ic i-plus"></i></span></div>
      <div class="setrow"><span class="badge" style="background:var(--accent)"><i class="ic i-repeat"></i></span><div class="tt"><b class="body">Reps only</b><span class="cap">Burpees</span></div><span class="step mini"><i class="ic i-minus"></i><b class="score">30<small>reps</small></b><i class="ic i-plus"></i></span></div>
      <div class="setrow"><span class="badge" style="background:var(--gold)"><i class="ic i-timer"></i></span><div class="tt"><b class="body">Duration</b><span class="cap">Plank, 5 s steps</span></div><span class="step mini"><i class="ic i-minus"></i><b class="score">1:00</b><i class="ic i-plus"></i></span></div>
    </section>
  </div>
</div>
</div>
</body></html>
