<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SE: Travel Gallery</title>
  <link rel="icon" type="image/png" href="../images/favicon.png" />
  <meta name="description" content="Travel photography by Sajith Edirisinghe — a map of places explored.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f0f4ff;
      --sea: #e6ebfa;
      --land: #ffffff;
      --land-edge: #d6d0f0;
      --ink: #1a1a2e;
      --ink-soft: #4a4a68;
      --live: #6c5ce7;
      --soon: #b8b2e0;
      --paper: #ffffff;
      --shadow: 0 20px 60px rgba(108, 92, 231, 0.08), 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f1a;
        --sea: #12121f;
        --land: #262647;
        --land-edge: #3a3a63;
        --ink: #f0f0f5;
        --ink-soft: #a0a0b8;
        --live: #a29bfe;
        --soon: #55507a;
        --paper: #1a1a2e;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 3rem;
      -webkit-font-smoothing: antialiased;
    }

    .back-link {
      align-self: flex-start;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink-soft);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 100px;
      background: color-mix(in srgb, var(--paper) 70%, transparent);
      border: 1px solid var(--land-edge);
      transition: color 0.2s, transform 0.2s;
    }
    .back-link:hover { color: var(--ink); transform: translateX(-2px); }

    .masthead { text-align: center; margin: 1.5rem 0 0.25rem; }

    .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--live);
      margin-top: 0.4rem;
    }

    .page-title {
      font-family: "Dancing Script", cursive;
      font-size: clamp(3rem, 7vw, 4.6rem);
      font-weight: 700;
      line-height: 1.25;
      padding: 0.1em 0.1em 0.15em;
      background: linear-gradient(115deg, #ff8a00, #ff3e55, #9145ff, #32c8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .atlas {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: 1.75rem auto 0;
      filter: drop-shadow(0 30px 40px rgba(40, 34, 20, 0.18));
    }

    .atlas {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--land-edge);
      box-shadow: var(--shadow);
    }
    .atlas svg { width: 100%; height: auto; display: block; }

    .sea { fill: var(--sea); }
    .land { fill: var(--land); stroke: var(--land-edge); stroke-width: 1; stroke-linejoin: round; fill-rule: evenodd; }

    /* Pins */
    .pin {
      cursor: pointer;
      text-decoration: none;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: drop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .pin__halo {
      fill: var(--live);
      opacity: 0.28;
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2.6s ease-in-out infinite;
    }
    .pin__dot { fill: var(--live); stroke: var(--paper); stroke-width: 3; }
    .pin__core { fill: var(--paper); }

    .pin--soon { cursor: default; }
    .pin--soon .pin__dot { fill: var(--soon); }
    .pin--soon .pin__halo { display: none; }

    .pin__label {
      font-family: "Outfit", sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--paper);
      stroke-width: 5px;
      stroke-linejoin: round;
    }
    .pin__dot, .pin__label { transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1); transform-box: fill-box; transform-origin: center bottom; }
    .pin:hover .pin__dot, .pin:focus-visible .pin__dot { transform: scale(1.25); }
    .pin:hover .pin__label { transform: translateY(-2px); }
    .pin:focus-visible { outline: none; }
    .pin:focus-visible .pin__dot { stroke: var(--live); stroke-width: 4; }

    .footer { margin-top: 2.5rem; font-size: 0.8rem; color: var(--ink-soft); }

    @keyframes drop {
      0% { opacity: 0; transform: translateY(-26px) scale(0.6); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.28; }
      50% { transform: scale(1.9); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pin { animation: none; opacity: 1; }
      .pin__halo { animation: none; }
    }

    @media (max-width: 700px) {
      body { padding: 1.25rem 1rem 2rem; }
      .atlas.is-zoomed .pin__label { font-size: 13px; stroke-width: 3px; }
      .atlas.is-zoomed .pin__dot { r: 4; stroke-width: 2; }
      .atlas.is-zoomed .pin__core { r: 1.4; }
      .atlas.is-zoomed .pin__halo { r: 4; }
    }
  </style>
</head>
