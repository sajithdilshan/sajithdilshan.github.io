<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SE: Travel Gallery</title>
  <link rel="icon" type="image/png" href="../images/favicon.png" />
  <meta name="description" content="Travel photography by Sajith Edirisinghe">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f0f4ff;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-soft: #4a4a68;
      --accent: #6c5ce7;
      --accent-2: #0984e3;
      --accent-3: #00b894;
      --chip-bg: #f3f0ff;
      --chip-border: #e4dff7;
      --shadow: 0 20px 60px rgba(108, 92, 231, 0.08), 0 4px 20px rgba(0, 0, 0, 0.04);
      --overlay-from: rgba(26, 26, 46, 0.95);
      --overlay-mid: rgba(26, 26, 46, 0.6);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f1a;
        --card-bg: #1a1a2e;
        --text: #f0f0f5;
        --text-soft: #a0a0b8;
        --accent: #a29bfe;
        --accent-2: #74b9ff;
        --accent-3: #55efc4;
        --chip-bg: #252540;
        --chip-border: #33335a;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.2);
        --overlay-from: rgba(15, 15, 26, 0.95);
        --overlay-mid: rgba(15, 15, 26, 0.6);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-soft);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 100px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      transition: color 0.2s, transform 0.2s;
      z-index: 100;
    }

    .back-link:hover {
      color: var(--text);
      transform: translateX(-2px);
    }

    .page-title {
      font-family: "Dancing Script", cursive;
      font-size: clamp(2.8rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0;
      text-align: center;
      margin-bottom: 2.5rem;
      background: linear-gradient(115deg, #ff8a00, #ff3e55, #9145ff, #32c8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .showcases {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 1.5rem;
      max-width: 860px;
      width: 100%;
    }

    .showcase-card {
      position: relative;
      display: block;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
    }

    .showcase-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(108, 92, 231, 0.12), 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .showcase-image {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .showcase-card:hover .showcase-image {
      transform: scale(1.04);
    }

    .showcase-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.75rem;
      background: linear-gradient(to top, var(--overlay-from) 0%, var(--overlay-mid) 60%, transparent 100%);
    }

    .showcase-title {
      font-family: "Dancing Script", cursive;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    .showcase-subtitle {
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
    }

    .showcase-cta {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent-3);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .showcase-card:hover .showcase-cta {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    @media (max-width: 600px) {
      body {
        padding: 1.5rem;
      }

      .back-link {
        top: 1rem;
        left: 1rem;
      }

      .page-title {
        margin-top: 3rem;
      }

      .showcase-image {
        height: 220px;
      }

      .showcase-cta {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="back-link">&larr; Home</a>

  <h1 class="page-title">Travel</h1>

  <div class="showcases">
    <a href="./naples/index.html" class="showcase-card">
      <img src="./thumbnails/naples.png" alt="Naples cityscape with Mount Vesuvius" class="showcase-image">
      <div class="showcase-overlay">
        <h2 class="showcase-title">Naples</h2>
        <p class="showcase-subtitle">Ancient streets, vibrant culture & volcanic majesty</p>
        <span class="showcase-cta">Explore gallery &rarr;</span>
      </div>
    </a>

    <a href="./amalfi-coast/index.html" class="showcase-card">
      <img src="./thumbnails/amalfi-coast.png" alt="Amalfi Coast colorful cliffside villages" class="showcase-image">
      <div class="showcase-overlay">
        <h2 class="showcase-title">Amalfi Coast</h2>
        <p class="showcase-subtitle">Dramatic cliffs, azure waters & coastal charm</p>
        <span class="showcase-cta">Explore gallery &rarr;</span>
      </div>
    </a>
  </div>

  <footer class="footer">
    &copy; <span id="year"></span> Sajith Edirisinghe
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>

</html>
